name: Site-Shot Screenshot
description: Capture one public https:// page as a PNG with the Site-Shot API, in one capture attempt with retries disabled.
inputs:
  url:
    description: The public https:// page to capture, such as https://www.example.com/.
    required: true
  api-key:
    description: A Site-Shot API key; a confirmed account's key comes with the free plan, 100 captures a month, unless the account has had a paid plan. Pass it from a GitHub Actions secret; never write the key into a workflow.
    required: true
  width:
    description: Viewport width in pixels, 100 to 8000.
    required: false
    default: "1024"
  height:
    description: Viewport height in pixels, 100 to 20000.
    required: false
    default: "768"
  country:
    description: Optional two-letter country code, such as DE. With a country the capture is strict, and fails instead of using another country. On the free plan only US works; Site-Shot refuses any other country, the step fails, and the refused attempt still counts toward the month's 100. Other countries need a paid plan.
    required: false
    default: ""
  full-page:
    description: true to capture the whole scrollable page, up to 20000 pixels high, instead of the viewport only.
    required: false
    default: "false"
  no-cookie-popup:
    description: true to have Site-Shot remove cookie-consent banners before the capture.
    required: false
    default: "false"
  no-ads:
    description: true to have Site-Shot remove ads before the capture.
    required: false
    default: "false"
  delay:
    description: Optional wait before the capture, in milliseconds, 0 to 60000. Empty uses Site-Shot's default of 500.
    required: false
    default: ""
outputs:
  path:
    description: The saved PNG, relative to the workspace. Always site-shot-output/screenshot.png.
runs:
  using: node24
  main: dist/index.mjs
